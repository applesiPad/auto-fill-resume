<!DOCTYPE html>
<!-- 结构模拟:弹窗式多条目(Moka/北森/自建 ATS 常见)
     特征: 教育经历区初始为空,只有"新增"按钮;点击弹出 Modal 表单,
     填完需点"确定"提交落列表,再点"新增"录入下一条 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>候选人申请表 - 某集团校招</title>
<style>
body{font:14px/1.7 -apple-system,"Microsoft YaHei",sans-serif;background:#f5f6f8;margin:0;padding:20px}
.page{max-width:620px;margin:0 auto}
.sec{background:#fff;border-radius:8px;padding:16px 20px;margin-bottom:14px}
h3{font-size:15px;margin:0 0 12px;padding-left:8px;border-left:3px solid #2f54eb}
.btn-add{background:#fff;border:1px dashed #2f54eb;color:#2f54eb;border-radius:4px;padding:6px 18px;cursor:pointer}
#eduList{list-style:none;padding:0;margin:12px 0 0}
.edu-item{background:#fafafa;border:1px solid #eee;border-radius:4px;padding:8px 12px;margin-bottom:6px;font-size:13px}
.ant-modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1000}
.ant-modal{background:#fff;border-radius:8px;width:460px;box-shadow:0 6px 30px rgba(0,0,0,.2)}
.ant-modal-content{padding:0}
.ant-modal-header{padding:14px 20px;border-bottom:1px solid #f0f0f0;font-weight:600}
.ant-modal-body{padding:16px 20px}
.ant-form-item{display:flex;align-items:center;margin-bottom:12px}
.ant-form-item-label{width:88px;text-align:right;padding-right:10px;color:#666}
.ant-form-item-label label::before{content:"* ";color:#ff4d4f}
.ant-form-item-control{flex:1}
.ant-input{width:100%;border:1px solid #d9d9d9;border-radius:4px;padding:4px 10px;height:30px;box-sizing:border-box}
.ant-modal-footer{padding:12px 20px;border-top:1px solid #f0f0f0;text-align:right}
.ant-btn{border:1px solid #d9d9d9;background:#fff;border-radius:4px;padding:5px 16px;margin-left:8px;cursor:pointer}
.ant-btn-primary{background:#2f54eb;border-color:#2f54eb;color:#fff}
</style>
</head>
<body>
<div class="page">
  <div class="sec">
    <h3 class="section-title">教育经历</h3>
    <button type="button" class="btn-add" id="btnAddEdu">新增教育经历</button>
    <ul id="eduList"></ul>
  </div>
</div>

<!-- Modal(初始隐藏) -->
<div class="ant-modal-wrap" id="modalWrap" role="dialog" aria-label="新增教育经历">
  <div class="ant-modal">
    <div class="ant-modal-content">
      <div class="ant-modal-header">新增教育经历</div>
      <div class="ant-modal-body">
        <div class="ant-form-item">
          <div class="ant-form-item-label"><label>学校名称</label></div>
          <div class="ant-form-item-control"><input class="ant-input" id="m-school"></div>
        </div>
        <div class="ant-form-item">
          <div class="ant-form-item-label"><label>专业名称</label></div>
          <div class="ant-form-item-control"><input class="ant-input" id="m-major"></div>
        </div>
        <div class="ant-form-item">
          <div class="ant-form-item-label"><label>学历</label></div>
          <div class="ant-form-item-control">
            <select id="m-degree" style="height:32px;border:1px solid #d9d9d9;border-radius:4px;width:160px">
              <option value="">请选择</option>
              <option>博士</option><option>硕士</option><option>本科</option><option>大专</option><option>高中</option>
            </select>
          </div>
        </div>
        <div class="ant-form-item">
          <div class="ant-form-item-label"><label>入学时间</label></div>
          <div class="ant-form-item-control"><input class="ant-input" id="m-start" placeholder="2019-09"></div>
        </div>
        <div class="ant-form-item">
          <div class="ant-form-item-label"><label>毕业时间</label></div>
          <div class="ant-form-item-control"><input class="ant-input" id="m-end" placeholder="2023-06"></div>
        </div>
      </div>
      <div class="ant-modal-footer">
        <button type="button" class="ant-btn" id="mCancel">取 消</button>
        <button type="button" class="ant-btn ant-btn-primary" id="mOk">确 定</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var wrap = document.getElementById('modalWrap');
  function open() {
    ['m-school','m-major','m-start','m-end'].forEach(function (id) { document.getElementById(id).value = ''; });
    document.getElementById('m-degree').selectedIndex = 0;
    wrap.style.display = 'flex';
  }
  function close() { wrap.style.display = 'none'; }
  document.getElementById('btnAddEdu').addEventListener('click', open);
  document.getElementById('mCancel').addEventListener('click', close);
  document.getElementById('mOk').addEventListener('click', function () {
    var school = document.getElementById('m-school').value;
    var degree = document.getElementById('m-degree').value;
    var major = document.getElementById('m-major').value;
    if (!school) { alert('请填写学校名称'); return; }
    var li = document.createElement('li');
    li.className = 'edu-item';
    li.textContent = [school, degree, major].filter(Boolean).join(' · ');
    document.getElementById('eduList').appendChild(li);
    close();
  });
})();
</script>

<script type="application/json" id="__rf_expected">
{
  "adapters": [],
  "fields": [
    { "sel": "#eduList", "countSel": ".edu-item", "mode": "count", "expect": 2 },
    { "sel": "#eduList .edu-item:nth-child(1)", "mode": "contains", "expect": "清华大学" },
    { "sel": "#eduList .edu-item:nth-child(1)", "mode": "contains", "expect": "本科" },
    { "sel": "#eduList .edu-item:nth-child(2)", "mode": "contains", "expect": "北京四中" },
    { "sel": "#modalWrap", "mode": "gone" }
  ]
}
</script>
</body>
</html>
